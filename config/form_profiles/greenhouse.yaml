# Greenhouse hosted boards (job-boards.greenhouse.io, boards.greenhouse.io). Standard selectors re-verified
# on a live Stripe form 2026-10-29 (reached via the Apply link -> /embed/job_app frame). Custom questions
# carry generated ids (question_<n>) and are mapped by label; company-specific screening questions are left
# to the answer bank.
ats: greenhouse
detect: "(job-boards|boards)(\\.eu)?\\.greenhouse\\.io/([^/]+/jobs/\\d+|embed/job_app)"
steps:
  - click: "button:has-text('Accept all'), button:has-text('Accept All Cookies')"
    optional: true
fields:
  "#first_name": profile.first_name
  "#last_name": profile.last_name
  "#email": profile.email
  "#phone": profile.phone
  "#country": profile.location
  "#candidate-location": profile.location   # "Location (City)" autocomplete, standard on newer GH boards
  "#resume": derived.resume_path
  "#cover_letter": skip            # file upload for a letter; the text version goes in a question when asked
  "label=LinkedIn Profile": profile.linkedin
  "label=GitHub": profile.github
  "label=current country of residence": profile.location
  # Tight phrasings only: a bare "sponsor" substring also binds inverse questions ("authorized to work WITHOUT
  # sponsorship?"), writing the wrong boolean. Stripe's live wording is "...sponsor you for a work permit".
  "label=require sponsorship": derived.needs_sponsorship
  "label=sponsor you for a work permit": derived.needs_sponsorship
  "label=Gender": profile.gender
  "label=Veteran Status": profile.veteran_status
  "label=Disability Status": profile.disability_status
  "label=Hispanic/Latino": skip
submit: "button[type=submit]"
success:
  - "text=Thank you for applying"
  - "#application_confirmation"
never:
  - "textarea[name=g-recaptcha-response]"
  - "input[type=search]"
