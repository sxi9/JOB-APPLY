# SmartRecruiters (jobs.smartrecruiters.com/<Company>/<id>). Field names from the standard apply form.
# STILL NOT verified live: the public posting is fronted by a DataDome bot wall (geo.captcha-delivery.com)
# that blocks headless automation entirely, so these selectors remain best-effort. The resume upload is a
# file widget, matched by type rather than an assumed name. Review the first real dry-run screenshot locally.
ats: smartrecruiters
detect: "jobs\\.smartrecruiters\\.com/"
steps:
  - click: "a:has-text(\"I'm interested\"), button:has-text(\"I'm interested\"), button:has-text('Apply')"
    optional: true
fields:
  "input[name=firstName]": profile.first_name
  "input[name=lastName]": profile.last_name
  "input[name=email]": profile.email
  "input[name=phoneNumber]": profile.phone
  "input[name=location]": profile.location
  "input[type=file]": derived.resume_path
  "input[name=linkedin]": profile.linkedin
  "label=privacy": const:Yes
submit: "button[type=submit]"
success:
  - "text=Thank you"
  - "text=Application received"
