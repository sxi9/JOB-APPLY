# Search terms for query-based sources (jobspy sites, Adzuna, JSearch, LinkedIn guest search).
# Each active user's filters.roles are added to these at collect time.
queries:
  - python developer
  - backend engineer
location: ""
hours_old: 24
# Breadth mode: when true (default), the query-based collectors run over the WHOLE role taxonomy
# (roles.search_queries()) so the shared pool covers every sector, not just a few companies. A rotating
# slice of `broad_queries_per_run` queries runs each collect (cycling through the full set across runs via
# a stored offset) to respect LinkedIn rate limits. Per-user filters still narrow each user to their roles.
# Budget interaction: these broad queries are fed to the LinkedIn guest collector, which has a per-run
# request budget (linkedin.max_requests). The collector reserves part of that budget for posting-detail
# fetches (offsite apply URL, ATS type, Easy Apply flag), so more broad queries means fewer search pages
# per query, not starved enrichment. Keep broad_queries_per_run modest relative to linkedin.max_requests.
broad: true
broad_queries_per_run: 12
# Public feeds polled every run.
feeds: [remotive, remoteok, jobicy, arbeitnow, themuse, hn]
# Needs `uv sync --extra jobspy`. Indeed, LinkedIn guest search, Glassdoor, ZipRecruiter.
jobspy_sites: []
# LinkedIn guest search (no login, no extra dependency): the public endpoint the logged-out
# jobs page uses. Age is in MINUTES so a 30-minute collect interval only sees fresh postings.
# Guests get rate limited (HTTP 429/999); keep max_results and max_details modest.
linkedin:
  enabled: true
  minutes_old: 2880          # last 48h
  location: "India"        # free text; geo_id below is more precise when set
  geo_id: null             # e.g. 102713980 for India, 92000000 for Worldwide
  remote_only: false       # f_WT=2
  easy_apply_only: false   # f_AL=true; the server filter is trusted, a fetched posting page can overrule it
  max_results: 50          # per query, 10 per page
  max_details: 40          # posting pages fetched per run (description, direct apply link, Easy Apply flag)
  max_requests: 60         # search + posting requests per run, over all queries; the run stops politely there.
                           # A slice is reserved for posting-detail fetches so a wide broad query set still
                           # resolves apply URLs / ATS / Easy Apply instead of storing bare /jobs/view links.
# A 429/999 or an authwall redirect records app_settings.linkedin_guest_cooldown_until (2 h, doubling on
# repeats); the guest collector also stays off while any user's LinkedIn challenge cooldown is active.
# Hot-polling tier: a second collect task (JOBAPPLY_HOT_INTERVAL_MINUTES, default 5) that runs ONLY the
# fast exact-timestamp sources for minute-level recency. `companies` lists company names (as in
# companies.yaml) whose ATS API should be polled hot; set `linkedin: true` to include the guest search,
# optionally with a tighter `linkedin_minutes_old`. A company may instead carry `hot: true` in
# companies.yaml. Leave empty to run no hot tier. The normal collect task is unchanged.
hot:
  companies: []
  linkedin: false
  # linkedin_minutes_old: 15
# Assisted sites' PUBLIC (logged-out) search. Each enabled site gets the same query list as the LinkedIn guest
# collector (searches.queries + the broad rotation + every user's roles) with its own per-run request budget,
# polite delays and an app_settings cooldown (`<site>_public_cooldown_until`, 2 h doubling to 48 h) recorded on
# a 403/406/429/Cloudflare block, so a blocked site is skipped on the following runs. `hours_old` defaults to
# the top-level value; `max_results` is per query. Applying on these sites needs a cookie-import login
# (Settings -> Sites -> Connect, or `jobapply sites import-cookies`); searching does not.
assisted:
  naukri:
    enabled: false           # the logged-out JSON API answered "recaptcha required" (HTTP 406) from this
                             # machine on 2026-10-29; enable to retry (one request, then a cooldown on a block)
    location: ""
    max_results: 40
    max_requests: 30
  instahyre:
    enabled: true            # GET /api/v1/job_search + opportunity pages; location filtered client-side
    location: ""
    max_results: 40
    max_requests: 40
    with_details: true       # opportunity page per job (description, posted date); max_details per run
    max_details: 20
  cutshort:
    enabled: true            # public hub endpoint (/backend-api/webpage/jobs/<topic>-jobs), CDN-cached 4 h
    location: ""
    max_results: 50
    max_requests: 40
    remote_only: false
    hub_slugs: []            # explicit hubs, e.g. [python-jobs, remote-backend-developer-jobs]
  wellfound:
    enabled: true            # public /role/<slug> landing pages; queries outside Wellfound's role taxonomy 404
    location: ""
    max_results: 40
    max_requests: 40
    remote_only: false
    max_pages: 3
