{% extends "base.html" %}
{% block title %}Log in · JOB-APPLY{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>JOB-APPLY</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center">Log in</button>
  </form>
</div>
{% endblock %}
