{% extends "base.html" %}
{% block title %}Jobs · JOB-APPLY{% endblock %}
{% block content %}
<div class="row spread"><h1>Jobs</h1>
  <div class="row small">
    <a class="btn btn-sm {{ 'btn-primary' if params.get('scope', 'mine') == 'mine' }}" href="/jobs">Matched for me</a>
    <a class="btn btn-sm {{ 'btn-primary' if params.get('scope') == 'all' }}" href="/jobs?scope=all">All jobs</a>
  </div>
</div>
<form class="card filters" hx-get="/jobs" hx-target="#job-rows" hx-push-url="true" hx-trigger="change, submit, keyup changed delay:400ms from:input[type=search]">
  <input type="hidden" name="scope" value="{{ params.get('scope', 'mine') }}">
  <div><label>Search</label><input type="search" name="q" value="{{ params.get('q', '') }}" placeholder="title or text"></div>
  <div><label>Posted within</label><select name="hours">
    <option value="">any time</option>
    {% for h, t in [(6, "6 hours"), (24, "24 hours"), (48, "48 hours"), (72, "3 days"), (168, "7 days")] %}
    <option value="{{ h }}" {{ 'selected' if params.get('hours') == h|string }}>{{ t }}</option>{% endfor %}
  </select></div>
  <div><label>Source</label><select name="source"><option value="">all</option>
    {% for s in sources %}<option {{ 'selected' if params.get('source') == s }}>{{ s }}</option>{% endfor %}</select></div>
  <div><label>Min score</label><input type="number" name="min_score" min="0" max="100" value="{{ params.get('min_score', '') }}"></div>
  <div><label>Location</label><input type="text" name="location" value="{{ params.get('location', '') }}"></div>
  <div><label>Company</label><input type="text" name="company" value="{{ params.get('company', '') }}"></div>
  <div><label>Salary max ≥</label><input type="number" name="salary" value="{{ params.get('salary', '') }}"></div>
  <div><label>Status</label><select name="status"><option value="">any</option>
    {% for st in statuses %}<option value="{{ st.value }}" {{ 'selected' if params.get('status') == st.value }}>{{ st | label }}</option>{% endfor %}
  </select></div>
  <div><label>Sort</label><select name="sort">
    <option value="posted">newest</option><option value="score" {{ 'selected' if params.get('sort') == 'score' }}>score</option></select></div>
  <div><label class="check"><input type="checkbox" name="remote" value="1" {{ 'checked' if params.get('remote') }}> Remote only</label></div>
</form>
<div class="card" style="margin-top:16px; padding: 4px 8px">
  <div class="table-wrap"><table>
    <thead><tr><th>Job</th><th class="hide-sm">Location</th><th>Posted</th><th class="hide-sm">Source</th><th>Score</th><th>Status</th></tr></thead>
    <tbody id="job-rows">{% include "_job_rows.html" %}</tbody>
  </table></div>
</div>
{% endblock %}
