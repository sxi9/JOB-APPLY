# Used by `uv run alembic ...` for authoring migrations. The app runs them with `jobapply db upgrade`.
[alembic]
script_location = src/jobapply/migrations
prepend_sys_path = .
# sqlalchemy.url comes from JOBAPPLY_DATABASE_URL via env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
