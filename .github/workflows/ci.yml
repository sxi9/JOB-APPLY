name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen --extra jobspy
      - name: Lint
        run: uv run ruff check src tests
      - name: Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Tests
        env:
          JOBAPPLY_LLM_BACKEND: fake
        run: uv run pytest
      - name: Migrations apply on a fresh database
        env:
          JOBAPPLY_DATABASE_URL: sqlite:///ci.db
        run: uv run jobapply db upgrade && uv run jobapply seed
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobapply:ci .
      - name: Smoke
        run: docker run --rm jobapply:ci --help
