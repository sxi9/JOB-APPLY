<!doctype html><html><head><meta charset="utf-8"><title>Data &amp; Reporting Analyst - Experian</title></head>
<body><form id="oneclick-form">
<div class="field"><label for="firstName">First name *</label><input id="firstName" name="firstName" type="text" required></div>
<div class="field"><label for="lastName">Last name *</label><input id="lastName" name="lastName" type="text" required></div>
<div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="phoneNumber">Phone number</label><input id="phoneNumber" name="phoneNumber" type="tel"></div>
<div class="field"><label for="location">Location</label><input id="location" name="location" type="text"></div>
<div class="field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required></div>
<div class="field"><label for="linkedin">LinkedIn profile</label><input id="linkedin" name="linkedin" type="url"></div>
<div class="field"><label for="screening_1">What is your notice period? *</label><input id="screening_1" name="screening_1" type="text" required></div>
<fieldset class="application-question"><legend>Privacy policy *</legend><label><input type="checkbox" name="privacyPolicy" value="true" required> I have read the privacy policy</label></fieldset>
<button type="submit" class="submit-button">Apply</button></form></body></html>
